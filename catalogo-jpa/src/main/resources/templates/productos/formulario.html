<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Nuevo Producto</title></head>
<body>
  <h1>Nuevo Producto</h1>
  <form th:action="@{/productos/guardar}" th:object="${producto}" method="post">
    <input type="hidden" th:field="*{id}" />
    <div>
      <label>Nombre:</label>
      <input type="text" th:field="*{nombre}" />
      <span th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></span>
    </div>
    <div>
      <label>Precio:</label>
      <input type="text" th:field="*{precio}" />
      <span th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}"></span>
    </div>
    <div>
      <label>Stock:</label>
      <input type="text" th:field="*{stock}" />
      <span th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}"></span>
    </div>
    <div>
      <label>Categoría:</label>
      <select name="categoriaId" required>
        <option value="">Seleccione una categoría</option>
        <option th:each="c : ${categorias}" th:value="${c.id}" th:text="${c.nombre}"
                th:selected="${param.categoriaId != null and param.categoriaId[0] == c.id.toString()}"></option>
      </select>
    </div>
    <button type="submit">Guardar</button>
    <a th:href="@{/productos}">Cancelar</a>
  </form>
</body>
</html>
