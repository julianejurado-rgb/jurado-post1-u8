<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Productos</title></head>
<body>
  <h1>Lista de Productos</h1>
  <a th:href="@{/productos/nuevo}">Nuevo Producto</a>
  <table>
    <thead>
      <tr><th>Nombre</th><th>Precio</th><th>Stock</th><th>Categoría</th><th>Acciones</th></tr>
    </thead>
    <tbody>
      <tr th:each="p : ${productos}">
        <td th:text="${p.nombre}"></td>
        <td th:text="${p.precio}"></td>
        <td th:text="${p.stock}"></td>
        <td th:text="${p.categoria.nombre}"></td>
        <td>
          <a th:href="@{/productos/eliminar/{id}(id=${p.id})}">Eliminar</a>
        </td>
      </tr>
    </tbody>
  </table>
  <a th:href="@{/categorias}">Ver categorías</a>
</body>
</html>
