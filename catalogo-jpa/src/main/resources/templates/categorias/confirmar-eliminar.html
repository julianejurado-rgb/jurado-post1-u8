<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Eliminar Categoría</title></head>
<body>
  <h1>Eliminar Categoría</h1>
  <p>¿Seguro que desea eliminar esta categoría?</p>
  <div>
    <label>Nombre:</label>
    <span th:text="${categoria.nombre}"></span>
  </div>
  <div>
    <label>Descripción:</label>
    <span th:text="${categoria.descripcion}"></span>
  </div>
  <form th:action="@{/categorias/eliminar/{id}(id=${categoria.id})}" method="post">
    <button type="submit">Confirmar</button>
    <a th:href="@{/categorias}">Cancelar</a>
  </form>
</body>
</html>
